name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: github.event.pull_request.draft == false
    # Pinned by commit SHA, not the mutable `v6` tag, per imrohitagrawal/.github's
    # versioning policy (see its docs/repo-onboarding.md and the redesign plan's
    # section 4) -- the same SHA-pin treatment WP2 applied to third-party actions
    # inside the reusable workflow, applied one level up to the reusable workflow
    # reference itself. The `# v6` comment is for human readability only; it is
    # not consumed by GitHub. To bump: resolve the new tag's commit
    # (`git -C <clone of imrohitagrawal/.github> rev-parse vN^{commit}`) and
    # replace both the SHA and the comment together.
    #
    # Bumped from v5 to v6 (2026-08-12): v5 shipped with two real bugs in its
    # native Python path (missing PEP 735 dependency-group install; pip-audit
    # hard-failing on the local editable package), found and fixed within
    # hours of v5's release, before this template repo had any real adopter.
    uses: imrohitagrawal/.github/.github/workflows/reusable-pr-quality.yml@6bd9eec68b0fa7db8b60de89ee541666893febaa # v6
