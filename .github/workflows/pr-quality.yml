name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: github.event.pull_request.draft == false
    # Pinned by commit SHA, not the mutable `v8` tag, per imrohitagrawal/.github's
    # versioning policy (see its docs/repo-onboarding.md and the redesign plan's
    # section 4) -- the same SHA-pin treatment WP2 applied to third-party actions
    # inside the reusable workflow, applied one level up to the reusable workflow
    # reference itself. The `# v8` comment is for human readability only; it is
    # not consumed by GitHub. To bump: resolve the new tag's commit
    # (`git -C <clone of imrohitagrawal/.github> rev-parse vN^{commit}`) and
    # replace both the SHA and the comment together.
    #
    # Bumped from v5 to v6 (2026-08-12): v5 shipped with two real bugs in its
    # native Python path (missing PEP 735 dependency-group install; pip-audit
    # hard-failing on the local editable package), found and fixed within
    # hours of v5's release, before this template repo had any real adopter.
    #
    # Bumped from v6 to v7 (2026-08-14): v6 was 30 commits behind three rounds
    # of review on the gate itself - including an RCE via a crafted
    # `packageManager` field, a GITHUB_OUTPUT-forgery variant of the same bug,
    # and yarn lockfile integrity being silently unenforced (`--immutable` is
    # a Berry flag that Yarn Classic accepts and ignores). See the v7 release
    # notes for the one behaviour change that needs a consumer's attention: a
    # placeholder Makefile target is now correctly distrusted, so the native
    # lint/typecheck/test step runs instead of being skipped.
    #
    # Bumped from v7 to v8 (2026-10-30): v8 moves the reusable workflow's own
    # actions to their current major versions (checkout v7, setup-uv v10,
    # setup-node v7, setup-python v7), plus fixes to that repo's own self-tests
    # and retrofit script. The reusable workflow's inputs are unchanged.
    uses: imrohitagrawal/.github/.github/workflows/reusable-pr-quality.yml@6e35f5c35ef38df74b8f867196186f588c5802cf # v8
