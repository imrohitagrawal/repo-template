# Dependabot version updates. Policy: never ignore major versions; group only minor and patch
# updates, so each major arrives as its own pull request with its own review and revert; wait 7 days
# after a release before proposing it (cooldown; use `default-days` only, since per-level days are
# not supported for every ecosystem). Security updates are separate: not grouped, not delayed and not
# counted against the limit below.
#
# Keep an entry only for an ecosystem whose manifest or lock file the repository really has: an entry
# without one opens no pull requests. This template has none yet, so only the GitHub Actions entry
# is active; when you add a manifest, copy the matching example below (or adapt one, per its note).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Examples. npm and pip split minor and patch updates by dependency type, so development and runtime
  # bumps get their own pull requests and review tiers. For "uv" (uv.lock), "docker" and "docker-compose",
  # which do not support dependency-type in groups, use one minor-patch group as in the entry above.
